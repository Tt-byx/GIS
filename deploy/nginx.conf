# T-006 统一入口与反向代理（SPEC/04 §1.1、§6.2）
# 启动顺序：MySQL → 建库灌种子 → IGServer 发布服务 → app(8080) → Nginx(80)
# 浏览器只访问 http://localhost，MUST NOT 直连 8080/6163（AR-03、AR-05）

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端构建产物（AR-29）：部署时改为本机 frontend/dist 的绝对路径
        root   C:/facility-gis/frontend/dist;
        index  index.html;

        # 单页应用路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API（SPEC 固定 8080）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        # IGServer REST：路径本身以 /igs 开头，proxy_pass 不带尾斜杠以保留前缀
        location /igs/ {
            proxy_pass http://127.0.0.1:6163;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }
    }
}
